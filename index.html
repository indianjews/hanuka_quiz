        .gold-border { border-color: var(--gold); }

            if (counterText && counterText.dataset.count) {
                const textSuffix = currentLang === 'he' ? 'סיימו' : 'completed';
                counterText.innerText = `${counterText.dataset.count} ${textSuffix}`;
            }

            renderCurrentState();
        }

        function renderCurrentState() {
            if (currentState === 'start') renderStart();
            else if (currentState === 'quiz') renderQuestion();
            else if (currentState === 'result') renderResult();
        }

        function renderStart() {
            const t = uiText[currentLang];
            const titleClass = currentLang === 'en' ? 'title-english tracking-wider' : 'font-bold';
            
            appContainer.innerHTML = `
                <div class="text-center fade-in flex flex-col justify-center h-full">
                    <h1 class="text-3xl md:text-5xl mb-3 gold-text ${titleClass}">${t.welcome}</h1>
                    <p class="text-base md:text-xl text-gray-300 mb-6 max-w-md mx-auto leading-relaxed">${t.subtitle}</p>
                    <button onclick="startQuiz()" class="btn-gold text-lg font-bold py-3 px-8 rounded-full shadow-lg w-full md:w-auto">
                        ${t.startBtn}
                    </button>
                    <div class="mt-6 flex justify-center gap-4 opacity-70">
                        <span class="text-3xl">🕎</span>
                        <span class="text-3xl">🍩</span>
                        <span class="text-3xl">✨</span>
                    </div>
                </div>
            `;
        }

        function startQuiz() {
            currentState = 'quiz';
            currentQuestionIndex = 0;
            score = 0;
            renderQuestion();
        }

        function getMenorahProgressHtml(currentIndex) {
            let candlesHtml = '';
            for (let i = 0; i < 9; i++) {
                let isShamash = i === 4; // Center candle
                let litCount = currentIndex + 1; // Number of question
                
                // If Hebrew (RTL), light from right to left [8,7,6,5, 3,2,1,0]. Else LTR.
                let actualLitIndices = currentLang === 'he' ? 
                    [8, 7, 6, 5, 3, 2, 1, 0].slice(0, litCount) : 
                    [0, 1, 2, 3, 5, 6, 7, 8].slice(0, litCount);
                
                let isLit = isShamash || actualLitIndices.includes(i);
                
                let hClass = isShamash ? 'h-7 md:h-9' : 'h-4 md:h-6';
                let flameOpacity = isLit ? 'opacity-100 scale-100' : 'opacity-0 scale-50';

                candlesHtml += `
                    <div class="flex flex-col items-center justify-end z-10 relative w-4 md:w-5">
                        <div class="text-yellow-400 text-sm md:text-base transform transition-all duration-500 ease-out mb-0.5 drop-shadow-[0_0_8px_rgba(250,204,21,0.8)] ${flameOpacity}" style="line-height: 1;">🔥</div>
                        <div class="w-2 md:w-2.5 ${hClass} bg-gradient-to-b from-[#f7d688] to-[#9a752e] rounded-t-sm shadow-md border border-yellow-800/30"></div>
                    </div>
                `;
            }
            
            return `
                <div class="w-full flex justify-center mb-3" dir="ltr">
                    <div class="relative flex justify-center items-end gap-1 md:gap-2 px-3 pb-2">
                        ${candlesHtml}
                        <!-- Menorah Horizontal Branch -->
                        <div class="absolute bottom-0 w-full h-2 md:h-2.5 bg-gradient-to-r from-[#9a752e] via-[#f7d688] to-[#9a752e] rounded-full shadow-lg"></div>
                        <!-- Menorah Base -->
                        <div class="absolute -bottom-3 w-10 h-3 bg-gradient-to-b from-[#dfb15b] to-[#9a752e] rounded-b-md"></div>
                    </div>
                </div>
            `;
        }

        function renderQuestion() {
            isAnswerChecked = false;
            selectedOption = null;
            const t = uiText[currentLang];
            const qData = quizData[currentQuestionIndex];
            const q = qData[currentLang];
            
            let optionsHtml = q.options.map((opt, index) => `
                <div onclick="selectOption(${index})" id="opt-${index}" class="option-card rounded-xl p-2.5 mb-2 text-base flex items-center gap-2.5">
                    <div class="w-5 h-5 rounded-full border-2 border-current flex-shrink-0 flex items-center justify-center">
                        <div class="w-2.5 h-2.5 rounded-full bg-current opacity-0 transition-opacity" id="opt-dot-${index}"></div>
                    </div>
                    <span>${opt}</span>
                </div>
            `).join('');

            appContainer.innerHTML = `
                <div class="fade-in flex flex-col h-full min-h-0">
                    <div class="flex-1 overflow-y-auto min-h-0 pb-1">
                        <div class="flex justify-between items-center mb-2 text-xs text-gray-400 font-semibold uppercase tracking-wider">
                            <span>${t.questionPrefix} ${currentQuestionIndex + 1} ${t.of} ${quizData.length}</span>
                            <span class="gold-text">Score: ${score}</span>
                        </div>

                        ${getMenorahProgressHtml(currentQuestionIndex)}

                        <h2 class="text-xl md:text-2xl font-semibold mb-3 leading-tight">${q.question}</h2>

                        <div id="options-container" class="mb-2">
                            ${optionsHtml}
                        </div>

                        <div id="feedback-container" class="hidden rounded-xl p-3 mb-2 border-l-4">
                            <h3 id="feedback-title" class="font-bold text-base mb-1"></h3>
                            <p id="feedback-text" class="text-gray-200 opacity-90 leading-snug text-sm"></p>
                        </div>
                    </div>

                    <div class="flex-shrink-0 pt-2">
                        <button id="action-btn" onclick="checkAnswer()" class="btn-gold text-base font-bold py-2.5 px-8 rounded-full shadow-lg w-full opacity-50 cursor-not-allowed transition-all" disabled>
                            ${t.checkBtn}
                        </button>
                    </div>
                </div>
            `;
        }

        function selectOption(index) {
            if (isAnswerChecked) return;
            
            selectedOption = index;
            
            // Reset styles
            document.querySelectorAll('.option-card').forEach(card => {
                card.classList.remove('selected');
                card.querySelector('div > div').classList.add('opacity-0');
            });
            
            // Set active style
            document.getElementById(`opt-${index}`).classList.add('selected');
            document.getElementById(`opt-dot-${index}`).classList.remove('opacity-0');
            
            // Enable button
            const actionBtn = document.getElementById('action-btn');
            actionBtn.disabled = false;
            actionBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        function checkAnswer() {
            if (selectedOption === null || isAnswerChecked) return;
            
            isAnswerChecked = true;
            const t = uiText[currentLang];
            const qData = quizData[currentQuestionIndex];
            const q = qData[currentLang];
            const isCorrect = selectedOption === qData.correctIndex;
            
            if (isCorrect) score++;

            // Highlight answers
            document.getElementById(`opt-${qData.correctIndex}`).classList.add('correct-bg');
            if (!isCorrect) {
                document.getElementById(`opt-${selectedOption}`).classList.add('wrong-bg');
            }

            // Show feedback
            const feedbackContainer = document.getElementById('feedback-container');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackText = document.getElementById('feedback-text');
            
            feedbackContainer.classList.remove('hidden');
            if (isCorrect) {
                feedbackContainer.classList.add('border-green-400', 'bg-green-400/10');
                feedbackTitle.innerText = t.correct;
                feedbackTitle.classList.add('text-green-400');
            } else {
                feedbackContainer.classList.add('border-red-400', 'bg-red-400/10');
                feedbackTitle.innerText = t.incorrect;
                feedbackTitle.classList.add('text-red-400');
            }
            feedbackText.innerText = q.explanation;

            // Change button
            const actionBtn = document.getElementById('action-btn');
            const isLastQuestion = currentQuestionIndex === quizData.length - 1;
            actionBtn.innerText = isLastQuestion ? t.finishBtn : t.nextBtn;
            actionBtn.onclick = async () => {
                if (isLastQuestion) {
                    if(window.incrementCompletions) window.incrementCompletions();
                    currentState = 'result';
                    renderResult();
                } else {
                    currentQuestionIndex++;
                    renderQuestion();
                }
            };
        }

        function renderResult() {
            const t = uiText[currentLang];
            const titleClass = currentLang === 'en' ? 'title-english tracking-wider' : 'font-bold';
            
            let message = '';
            if (score === quizData.length) message = t.perfectScore;
            else if (score >= quizData.length / 2) message = t.goodScore;
            else message = t.lowScore;

            appContainer.innerHTML = `
                <div class="text-center fade-in flex flex-col justify-center h-full">
                    <div class="text-5xl mb-2">🕎✨</div>
                    <h1 class="text-3xl md:text-5xl mb-1 gold-text ${titleClass}">${t.resultsTitle}</h1>
                    <p class="text-base text-gray-300 mb-3">${t.scoreIs}</p>

                    <div class="text-5xl font-bold gold-text mb-3">
                        ${score} <span class="text-2xl text-white/50">/ ${quizData.length}</span>
                    </div>

                    <p class="text-base md:text-lg text-white bg-white/10 rounded-xl p-3 mb-5 inline-block">
                        ${message}
                    </p>

                    <div class="flex flex-col md:flex-row justify-center items-center gap-3">
                        <button onclick="openShareModal()" class="border-2 gold-border gold-text text-base font-bold py-2.5 px-8 rounded-full hover:bg-yellow-600/20 transition-all w-full md:w-auto flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                            ${t.shareBtn}
                        </button>
                        <button onclick="startQuiz()" class="btn-gold text-base font-bold py-2.5 px-8 rounded-full shadow-lg w-full md:w-auto">
                            ${t.restartBtn}
                        </button>
                    </div>
                </div>
            `;
        }

        // --- New Share Modal Logic ---
        function openShareModal() {
            const modal = document.getElementById('share-modal');
            const modalContent = document.getElementById('share-modal-content');
            
            // Update texts based on lang
            document.getElementById('share-title').innerText = currentLang === 'he' ? 'שתף תוצאה' : 'Share Result';
            document.getElementById('copy-btn-text').innerText = currentLang === 'he' ? 'העתק טקסט' : 'Copy Text';
            document.querySelector('#share-modal button:last-child').innerText = currentLang === 'he' ? 'סגור' : 'Close';

            modal.classList.remove('hidden');
            // Trigger animation
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeShareModal() {
            const modal = document.getElementById('share-modal');
            const modalContent = document.getElementById('share-modal-content');
            
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function getShareText() {
            return currentLang === 'he' ? 
                `קיבלתי ${score}/8 בחידון חנוכה של קהילת יהודי הודו! בואו לבדוק את הידע שלכם 🕎✨\nhttps://hanuka.indianjews.org` : 
                `I scored ${score}/8 on the Indian Jewish Hanukkah Quiz! Test your knowledge 🕎✨\nhttps://hanuka.indianjews.org`;
        }

        function shareWhatsApp() {
            window.open(`https://wa.me/?text=${encodeURIComponent(getShareText())}`, '_blank');
            closeShareModal();
        }

        function shareFacebook() {
            const url = encodeURIComponent('https://hanuka.indianjews.org');
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank');
            closeShareModal();
        }

        function copyShareText() {
            const text = getShareText();
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                const btnText = document.getElementById('copy-btn-text');
                btnText.innerText = currentLang === 'he' ? 'הועתק!' : 'Copied!';
                setTimeout(() => {
                    btnText.innerText = currentLang === 'he' ? 'העתק טקסט' : 'Copy Text';
                }, 2000);
            } catch (err) {
                console.error('Copy failed', err);
            }
            document.body.removeChild(textArea);
        }

        // Expose functions to window (necessary because script is type="module")
        window.toggleLanguage = toggleLanguage;
        window.startQuiz = startQuiz;
        window.selectOption = selectOption;
        window.checkAnswer = checkAnswer;
        window.openShareModal = openShareModal;
        window.closeShareModal = closeShareModal;
        window.shareWhatsApp = shareWhatsApp;
        window.shareFacebook = shareFacebook;
        window.copyShareText = copyShareText;

        // --- Firebase Integration for Completions Counter ---
        let db;
        let statsDocRef;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        async function initFirebase() {
            try {
                // To use this on your own GitHub Pages, you will need to replace this config with your own free Firebase project config.
                const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { projectId: "dummy" };
                
                if(firebaseConfig.projectId === "dummy") {
                    console.warn("No Firebase config detected. The counter will not work until connected to a real database.");
                    renderStart();
                    return;
                }
                
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                const auth = getAuth(app);

                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                // Reference to the completions document
                statsDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'stats', 'completions');
                
                // Listen to completions count in real-time
                onSnapshot(statsDocRef, (docSnap) => {
                    const counterContainer = document.getElementById('completions-counter');
                    const counterText = document.getElementById('completions-text');
                    
                    if (docSnap.exists()) {
                        const count = docSnap.data().count || 0;
                        counterContainer.classList.remove('hidden');
                        counterContainer.classList.add('flex');
                        counterText.dataset.count = count;
                        const textSuffix = currentLang === 'he' ? 'סיימו' : 'completed';
                        counterText.innerText = `${count} ${textSuffix}`;
                    }
                }, (error) => {
                    console.error("Error listening to stats:", error);
                });

            } catch (error) {
                console.error("Firebase init failed:", error);
            }
            renderStart();
        }

        window.incrementCompletions = async function() {
            if (!statsDocRef) return;
            try {
                const docSnap = await getDoc(statsDocRef);
                if (!docSnap.exists()) {
                    await setDoc(statsDocRef, { count: 1 });
                } else {
                    await updateDoc(statsDocRef, { count: increment(1) });
                }
            } catch (error) {
                console.error("Error updating stats:", error);
            }
        };

        // Initialize App
        initFirebase();
    </script>
</body>
</html>
